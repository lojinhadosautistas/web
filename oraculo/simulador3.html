<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ORÁCULO v4 • Condução Reflexiva</title>

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#050816;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{width:min(950px,92%);}

.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:28px;
  backdrop-filter:blur(12px);
}

h1{margin:0 0 10px;font-size:2rem;}

.buttons{margin-top:12px;}

button{
  margin:6px 6px 0 0;
  padding:12px 16px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-weight:700;
  background:#ffb300;
}

.secondary{
  background:rgba(255,255,255,.08);
  color:white;
}

.panel{
  margin-top:18px;
  background:rgba(0,0,0,.35);
  padding:16px;
  border-radius:12px;
  min-height:160px;
  line-height:1.6;
  white-space:pre-line;
}

.meta{
  margin-top:10px;
  font-size:.85rem;
  opacity:.7;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>ORÁCULO v4</h1>
<div style="opacity:.6">Sistema de Condução Reflexiva</div>

<p>
Este sistema não responde — ele organiza percursos de pensamento.
</p>

<div class="buttons">

<button onclick="acao('ativar')">Ativar Percurso</button>
<button onclick="acao('contexto')">Contextualizar</button>
<button onclick="acao('conduzir')">Conduzir Raciocínio</button>
<button onclick="acao('integrar')">Integrar Evidências</button>
<button class="secondary" onclick="acao('direcionar')">Direcionamento</button>

</div>

<div class="panel" id="output">
ORÁCULO aguardando ativação...
</div>

<div class="meta" id="meta"></div>

</div>

</div>

<script>

//////////////////////////////////////////////////////
// 🧠 ESTADO COGNITIVO DO SISTEMA
//////////////////////////////////////////////////////

const state = {
  fase: "inativo",
  carga: 0,
  coerencia: 0.5,
  tendencia: {
    analitico: 0.4,
    exploratorio: 0.3,
    estruturante: 0.3
  },
  memoriaCurta: []
};

//////////////////////////////////////////////////////
// 🧩 BLOCOS PROGRAMÁTICOS (BPs)
//////////////////////////////////////////////////////

const BPs = {

  ativacao: [
    "Um ponto de entrada foi identificado no sistema cognitivo.",
    "A demanda foi reconhecida como início de percurso reflexivo.",
    "O sistema inicia organização de contexto."
  ],

  contextualizacao: [
    "O cenário começa a ser estruturado a partir de evidências disponíveis.",
    "Variáveis relevantes são organizadas em campo interpretativo.",
    "O sistema delimita o espaço cognitivo da análise."
  ],

  conducao: [
    "O raciocínio é orientado por sequências interpretativas progressivas.",
    "Perguntas estruturam o deslocamento cognitivo.",
    "O percurso se organiza em camadas de compreensão."
  ],

  integracao: [
    "As evidências são articuladas em estrutura coerente.",
    "O sistema busca alinhamento entre variáveis dispersas.",
    "A leitura sistêmica começa a estabilizar relações."
  ],

  direcionamento: [
    "O sistema não decide, mas qualifica caminhos possíveis.",
    "As alternativas são organizadas sem imposição.",
    "O campo decisório é estruturado, não fechado."
  ]

};

//////////////////////////////////////////////////////
// 🧠 INTERPRETADOR DE ESTADO
//////////////////////////////////////////////////////

function modo(){

  if(state.coerencia < 0.4) return "contextualizacao";
  if(state.coerencia < 0.7) return "conducao";
  return "integracao";

}

//////////////////////////////////////////////////////
// 🧠 MOTOR DO ORÁCULO
//////////////////////////////////////////////////////

function oraculo(tipo){

  let base;

  if(tipo === "ativar"){
    state.fase = "ativacao";
    state.carga += 10;
  }

  if(tipo === "contexto"){
    state.fase = "contextualizacao";
    state.carga += 5;
    state.coerencia += 0.05;
  }

  if(tipo === "conduzir"){
    state.fase = "conducao";
    state.carga += 7;
    state.coerencia += 0.08;
  }

  if(tipo === "integrar"){
    state.fase = "integracao";
    state.coerencia += 0.1;
  }

  if(tipo === "direcionar"){
    state.fase = "direcionamento";
  }

  const pool = BPs[state.fase] || BPs.contextualizacao;

  base = pool[Math.floor(Math.random() * pool.length)];

  state.memoriaCurta.push(tipo);

  if(state.memoriaCurta.length > 6){
    state.memoriaCurta.shift();
  }

  return base;

}

//////////////////////////////////////////////////////
// 🧠 RENDER
//////////////////////////////////////////////////////

function acao(tipo){

  const msg = oraculo(tipo);

  document.getElementById("output").innerText =
    "ORÁCULO: " + msg;

  document.getElementById("meta").innerText =
    "fase: " + state.fase +
    " | coerência: " + state.coerencia.toFixed(2) +
    " | carga: " + state.carga +
    " | memória: [" + state.memoriaCurta.join(" → ") + "]";

}

</script>

</body>
</html>
