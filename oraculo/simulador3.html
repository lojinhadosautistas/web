<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ORÁCULO v3 • Motor Narrativo</title>

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#050814;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{width:min(900px,92%);}

.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:28px;
  backdrop-filter:blur(12px);
}

h1{margin:0 0 10px;font-size:2rem;}

button{
  margin:6px 6px 0 0;
  padding:12px 16px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-weight:700;
  background:#ffb300;
  color:#000;
}

.log{
  margin-top:18px;
  background:rgba(0,0,0,.35);
  padding:16px;
  border-radius:12px;
  min-height:120px;
  line-height:1.5;
  white-space:pre-line;
}

.small{opacity:.6;font-size:.9rem}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>ORÁCULO v3</h1>
    <div class="small">Motor narrativo de simulação cognitiva</div>

    <p>Interaja com o sistema. Ele interpreta o estado em tempo real.</p>

    <button onclick="acao('observar')">Observar</button>
    <button onclick="acao('analisar')">Analisar</button>
    <button onclick="acao('avancar')">Avançar</button>
    <button onclick="acao('fechar')">Fechar</button>

    <div class="log" id="log">ORÁCULO inicializando...</div>

  </div>

</div>

<script>

//////////////////////////////////////////////////////
// 🧠 ESTADO CENTRAL (MEMÓRIA VIVA)
//////////////////////////////////////////////////////

const state = {
  progresso: 0,
  carga: 0
};

//////////////////////////////////////////////////////
// 🧠 NÚCLEOS NARRATIVOS (COMPACTOS)
//////////////////////////////////////////////////////

const nuclei = {
  exploracao: [
    "o campo ainda está se formando",
    "existem sinais difusos na estrutura",
    "a leitura ainda não estabilizou"
  ],
  organizacao: [
    "padrões começam a se consolidar",
    "há coerência emergente no sistema",
    "as relações internas se alinham"
  ],
  fechamento: [
    "a estrutura atinge coerência funcional",
    "o sistema reconhece estabilidade",
    "há direção consolidada no campo"
  ]
};

//////////////////////////////////////////////////////
// 🧠 DETERMINAÇÃO DO MODO
//////////////////////////////////////////////////////

function mode(){

  if(state.progresso < 0.3) return "exploracao";
  if(state.progresso < 0.7) return "organizacao";
  return "fechamento";

}

//////////////////////////////////////////////////////
// 🧠 MOTOR ORÁCULO (CORE)
//////////////////////////////////////////////////////

function oraculo(action){

  const m = mode();
  const base = nuclei[m][Math.floor(Math.random()*nuclei[m].length)];

  switch(action){

    case "observar":
      state.progresso += 0.05;
      state.carga += 3;
      return `ORÁCULO: observação registrada.\n${base}`;

    case "analisar":
      state.progresso += 0.1;
      state.carga += 7;
      return `ORÁCULO: análise em curso.\n${base}`;

    case "avancar":
      state.progresso += 0.15;
      state.carga += 5;
      return `ORÁCULO: avanço reconhecido.\n${base}`;

    case "fechar":

      if(state.progresso < 0.8){
        return "ORÁCULO: sistema ainda não possui coerência suficiente para fechamento.";
      }

      return "ORÁCULO: ciclo concluído. estrutura estabilizada.";

    default:
      return "ORÁCULO: sem leitura válida.";
  }
}

//////////////////////////////////////////////////////
// 🧠 INTERFACE
//////////////////////////////////////////////////////

function acao(type){

  const msg = oraculo(type);

  document.getElementById("log").innerText =
    msg +
    "\n\nprogresso: " + state.progresso.toFixed(2) +
    " | carga: " + state.carga +
    " | modo: " + mode();

}

</script>

</body>
</html>
