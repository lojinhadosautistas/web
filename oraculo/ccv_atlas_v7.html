<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CCV ATLAS V7 — Campo Cognitivo Vivo</title>

<style>
body{
margin:0;
overflow:hidden;
background:#05070d;
font-family:Inter, sans-serif;
color:white;
}

canvas{
position:fixed;
top:0;
left:0;
}

#oracle{
position:fixed;
top:20px;
left:20px;
width:420px;
padding:18px;
background:rgba(0,0,0,.5);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(12px);
border-radius:16px;
font-size:14px;
line-height:1.5;
}

#title{
font-weight:800;
margin-bottom:10px;
color:#ffcc66;
}

.tag{
display:inline-block;
padding:3px 8px;
margin:2px;
font-size:11px;
border:1px solid rgba(255,255,255,.2);
border-radius:999px;
opacity:.8;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="oracle">
<div id="title">ORÁCULO — LEITURA DO CAMPO</div>
<div id="oracleText">Inicializando campo cognitivo...</div>
<div id="tags"></div>
</div>

<script>

/* ================================
CANVAS
================================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* ================================
NODES (BASE DOS 6 VOLUMES)
================================ */

const nodes = [
{ id:"rotina", label:"Rotina", tags:["estrutura","controle","previsibilidade"] },
{ id:"previsibilidade", label:"Previsibilidade", tags:["estrutura","ansiedade"] },
{ id:"sobrecarga", label:"Sobrecarga Sensorial", tags:["crise","intensidade","sensorial"] },
{ id:"hipersensibilidade", label:"Hipersensibilidade", tags:["sensorial","intensidade"] },
{ id:"terapia", label:"Terapia", tags:["processo","ajuste","estrutura"] },
{ id:"consulta", label:"Consulta Médica", tags:["institucional","controle","ansiedade"] },
{ id:"familia", label:"Família", tags:["relacao","emocional","conflito"] },
{ id:"amizade", label:"Amizade", tags:["relacao","emocional"] },
{ id:"limites", label:"Limites", tags:["autonomia","controle"] },
{ id:"crise", label:"Crise Emocional", tags:["crise","intensidade"] },
{ id:"mudanca", label:"Mudança", tags:["transicao","instabilidade"] },
{ id:"autonomia", label:"Autonomia", tags:["controle","liberdade"] }
];

/* ================================
INIT POSITIONS
================================ */

nodes.forEach(n=>{
n.x = Math.random()*canvas.width;
n.y = Math.random()*canvas.height;
n.vx = (Math.random()-0.5)*1.5;
n.vy = (Math.random()-0.5)*1.5;
});

/* ================================
CLUSTERS (DINÂMICOS)
================================ */

function getCluster(n){
if(n.tags.includes("sensorial")) return "Sistema Sensorial";
if(n.tags.includes("crise")) return "Estados Críticos";
if(n.tags.includes("estrutura")) return "Estrutura Cognitiva";
if(n.tags.includes("relacao")) return "Campo Social";
if(n.tags.includes("autonomia")) return "Autonomia";
if(n.tags.includes("institucional")) return "Sistema Institucional";
return "Neutro";
}

/* ================================
FORÇAS
================================ */

function applyForces(){

for(let i=0;i<nodes.length;i++){
for(let j=i+1;j<nodes.length;j++){

let a = nodes[i];
let b = nodes[j];

let dx = b.x - a.x;
let dy = b.y - a.y;

let dist = Math.sqrt(dx*dx + dy*dy);
if(dist < 1) continue;

/* afinidade */
let common = a.tags.filter(t=>b.tags.includes(t)).length;

/* força */
let force = (common > 0 ? 0.05 : -0.02);

let fx = dx/dist * force;
let fy = dy/dist * force;

a.vx += fx;
a.vy += fy;
b.vx -= fx;
b.vy -= fy;

}
}
}

/* ================================
UPDATE
================================ */

function update(){

applyForces();

nodes.forEach(n=>{

n.vx *= 0.98;
n.vy *= 0.98;

n.x += n.vx;
n.y += n.vy;

/* bounds */
if(n.x < 0 || n.x > canvas.width) n.vx *= -1;
if(n.y < 0 || n.y > canvas.height) n.vy *= -1;

});

}

/* ================================
DRAW
================================ */

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

/* links */
for(let i=0;i<nodes.length;i++){
for(let j=i+1;j<nodes.length;j++){

let a = nodes[i];
let b = nodes[j];

let dx = b.x - a.x;
let dy = b.y - a.y;

let dist = Math.sqrt(dx*dx + dy*dy);

let common = a.tags.filter(t=>b.tags.includes(t)).length;

if(dist < 180){

ctx.strokeStyle = common>0 ?
"rgba(255,200,100,0.4)" :
"rgba(100,150,255,0.08)";

ctx.lineWidth = common>0 ? 2 : 1;

ctx.beginPath();
ctx.moveTo(a.x,a.y);
ctx.lineTo(b.x,b.y);
ctx.stroke();
}

}
}

/* nodes */
nodes.forEach(n=>{

ctx.fillStyle = "rgba(255,255,255,0.9)";
ctx.beginPath();
ctx.arc(n.x,n.y,10,0,Math.PI*2);
ctx.fill();

ctx.fillStyle = "#ffcc66";
ctx.font = "12px Arial";
ctx.fillText(n.label, n.x+12, n.y+4);

});

}

/* ================================
ORÁCULO (NARRATIVA VIVA)
================================ */

function oracle(){

let tension = 0;
let activeClusters = {};

for(let i=0;i<nodes.length;i++){
for(let j=i+1;j<nodes.length;j++){

let a = nodes[i];
let b = nodes[j];

let common = a.tags.filter(t=>b.tags.includes(t)).length;

if(common === 0){
let dx = a.x - b.x;
let dy = a.y - b.y;
let dist = Math.sqrt(dx*dx+dy*dy);
if(dist < 120) tension++;
}

}
}

nodes.forEach(n=>{
let c = getCluster(n);
activeClusters[c] = (activeClusters[c]||0)+1;
});

let dominant = Object.entries(activeClusters)
.sort((a,b)=>b[1]-a[1])[0][0];

let text = "";

if(tension > 20){
text = "O campo apresenta alta tensão estrutural entre conceitos. Sistemas de rotina e controle entram em instabilidade.";
}else{
text = "O campo mantém coerência estrutural. Fluxos cognitivos estão integrados e estáveis.";
}

text += "\n\nCluster dominante: " + dominant;

document.getElementById("oracleText").innerText = text;

/* tags visuais */
let tagHTML = "";
for(let t in activeClusters){
tagHTML += `<span class="tag">${t}</span>`;
}
document.getElementById("tags").innerHTML = tagHTML;

}

/* ================================
LOOP
================================ */

function loop(){
update();
draw();
oracle();
requestAnimationFrame(loop);
}

loop();

/* resize */
window.onresize = ()=>{
canvas.width = innerWidth;
canvas.height = innerHeight;
};

</script>

</body>
</html>
