<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CCV v4 • Identidade Emergente</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#050816;
  font-family:Inter, sans-serif;
}

canvas{display:block;}

.hud{
  position:fixed;
  top:16px;
  left:16px;
  width:360px;
  padding:14px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(12px);
  color:white;
  font-size:13px;
  line-height:1.4;
}

.small{opacity:.7;margin-top:6px;}
span{color:#ffb300;}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="hud">
  <div><b>CCV v4 • IDENTIDADE EMERGENTE</b></div>

  <div class="small">estado identitário:</div>
  <div id="identity"></div>

  <div class="small">clusters:</div>
  <div id="clusters">0</div>

  <div class="small">narrativa do campo:</div>
  <div id="oracle"></div>
</div>

<script>

//////////////////////////////////////////////////////
// 🧠 CANVAS
//////////////////////////////////////////////////////

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

window.addEventListener("resize", ()=>{
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});

//////////////////////////////////////////////////////
// 🧠 IDENTIDADE DO CAMPO (NÚCLEO DO v4)
//////////////////////////////////////////////////////

const identity = {
  coherence: 0,
  stability: 0,
  dominantMode: "neutro",
  memory: []
};

//////////////////////////////////////////////////////
// 🧠 NÓS
//////////////////////////////////////////////////////

const tags = [
  "incerteza","decisão","estrutura","fluxo","caos",
  "ordem","ansiedade","clareza","ruído","silêncio",
  "memória","esquecimento","foco","dispersão","conflito",
  "integração","ruptura","estabilidade","movimento","ação"
];

const nodes = tags.map(t => ({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  vx:0,
  vy:0,
  label:t,
  r:4
}));

//////////////////////////////////////////////////////
// 🧠 GRUPOS
//////////////////////////////////////////////////////

function group(tag){

  const g = {
    caos:["caos","ruído","ruptura","conflito","ansiedade"],
    ordem:["ordem","estrutura","clareza","estabilidade"],
    fluxo:["fluxo","movimento","ação","integração"],
    introspectivo:["memória","silêncio","esquecimento"],
    cognitivo:["decisão","foco"]
  };

  for(let k in g){
    if(g[k].includes(tag)) return k;
  }

  return "neutro";
}

//////////////////////////////////////////////////////
// 🧠 CLUSTERS
//////////////////////////////////////////////////////

function detectClusters(){

  const visited = new Array(nodes.length).fill(false);
  const clusters = [];

  function dfs(i,c){

    visited[i]=true;
    c.push(nodes[i]);

    for(let j=0;j<nodes.length;j++){

      if(visited[j]) continue;

      const dx=nodes[i].x-nodes[j].x;
      const dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);

      if(d<85) dfs(j,c);

    }

  }

  for(let i=0;i<nodes.length;i++){
    if(!visited[i]){
      const c=[];
      dfs(i,c);
      clusters.push(c);
    }
  }

  return clusters;

}

//////////////////////////////////////////////////////
// 🧠 INTERPRETAÇÃO
//////////////////////////////////////////////////////

function interpret(cluster){

  const freq={};

  for(let n of cluster){
    const g=group(n.label);
    freq[g]=(freq[g]||0)+1;
  }

  return Object.entries(freq)
    .sort((a,b)=>b[1]-a[1])[0]?.[0] || "neutro";

}

//////////////////////////////////////////////////////
// 🧠 IDENTIDADE DO CAMPO (ATUALIZAÇÃO)
//////////////////////////////////////////////////////

function updateIdentity(clusters){

  const modes = clusters.map(c => interpret(c));

  const freq = {};

  modes.forEach(m=>{
    freq[m]=(freq[m]||0)+1;
  });

  const dominant = Object.entries(freq)
    .sort((a,b)=>b[1]-a[1])[0]?.[0] || "neutro";

  identity.dominantMode = dominant;

  identity.memory.push(dominant);

  if(identity.memory.length > 20){
    identity.memory.shift();
  }

  const stabilityScore =
    identity.memory.filter(m=>m===dominant).length /
    identity.memory.length;

  identity.stability = stabilityScore;

  identity.coherence = 1 - (clusters.length/10);

  document.getElementById("identity").innerHTML =
    `modo dominante: <span>${dominant}</span><br>` +
    `estabilidade: <span>${stabilityScore.toFixed(2)}</span>`;

}

//////////////////////////////////////////////////////
// 🧠 NARRATIVA DO ORÁCULO (v4)
//////////////////////////////////////////////////////

function narrative(){

  const m = identity.dominantMode;

  const map = {

    caos:"o campo mantém identidade instável com tendência à fragmentação recorrente",
    ordem:"o campo desenvolve coerência estrutural progressiva",
    fluxo:"o campo evolui em padrão de continuidade adaptativa",
    introspectivo:"o campo estabiliza interiorização como identidade dominante",
    cognitivo:"o campo consolida padrão decisório recorrente",
    neutro:"o campo não apresenta identidade dominante estável"

  };

  return map[m];

}

//////////////////////////////////////////////////////
// 🧠 FÍSICA (AGORA COM IDENTIDADE GLOBAL)
//////////////////////////////////////////////////////

function update(){

  const clusters = detectClusters();

  updateIdentity(clusters);

  for(let i=0;i<nodes.length;i++){

    const a=nodes[i];

    let fx=0, fy=0;

    for(let j=0;j<nodes.length;j++){

      if(i===j) continue;

      const b=nodes[j];

      const dx=b.x-a.x;
      const dy=b.y-a.y;
      const d=Math.sqrt(dx*dx+dy*dy)+0.1;

      let f = (group(a.label)===group(b.label)) ? 0.6 : 0.05;

      // 🔥 v4: identidade influencia o campo inteiro
      if(group(a.label) === identity.dominantMode){
        f *= 1.4;
      } else {
        f *= 0.85;
      }

      fx += (dx/d)*f;
      fy += (dy/d)*f;

    }

    fx += (Math.random()-0.5)*0.08;
    fy += (Math.random()-0.5)*0.08;

    a.vx += fx*0.02;
    a.vy += fy*0.02;

    a.vx *= 0.9;
    a.vy *= 0.9;

    a.x += a.vx;
    a.y += a.vy;

  }

  document.getElementById("clusters").innerText = clusters.length;
  document.getElementById("oracle").innerText = narrative();

}

//////////////////////////////////////////////////////
// 🧠 RENDER
//////////////////////////////////////////////////////

function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<nodes.length;i++){

    for(let j=i+1;j<nodes.length;j++){

      const a=nodes[i], b=nodes[j];

      const dx=a.x-b.x;
      const dy=a.y-b.y;
      const d=Math.sqrt(dx*dx+dy*dy);

      if(d<110){

        ctx.strokeStyle=`rgba(255,179,0,${1-d/110})`;
        ctx.lineWidth=0.5;

        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();

      }

    }

  }

  for(let n of nodes){

    ctx.fillStyle="#ffb300";
    ctx.beginPath();
    ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fill();

  }

}

//////////////////////////////////////////////////////
// 🧠 LOOP
//////////////////////////////////////////////////////

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
