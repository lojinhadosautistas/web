<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CCV v3 • Campo Cognitivo Vivo</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#050816;
  font-family:Inter, sans-serif;
}

canvas{display:block;}

.hud{
  position:fixed;
  top:16px;
  left:16px;
  width:340px;
  padding:12px;
  border-radius:12px;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(12px);
  color:white;
  font-size:13px;
  line-height:1.4;
}

.small{opacity:.7;margin-top:6px;}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="hud">
  <div><b>CCV v3 • REALIMENTAÇÃO SEMÂNTICA</b></div>

  <div class="small">clusters:</div>
  <div id="clusters">0</div>

  <div class="small">estado do campo:</div>
  <div id="oracle"></div>
</div>

<script>

//////////////////////////////////////////////////////
// 🧠 CANVAS
//////////////////////////////////////////////////////

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

window.addEventListener("resize", ()=>{
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});

//////////////////////////////////////////////////////
// 🧠 MEMÓRIA SEMÂNTICA GLOBAL (NOVO)
//////////////////////////////////////////////////////

const semanticMemory = {
  caos: 0,
  ordem: 0,
  fluxo: 0,
  introspectivo: 0,
  cognitivo: 0
};

//////////////////////////////////////////////////////
// 🧠 LINGUAGEM VIVA
//////////////////////////////////////////////////////

let narratives = [];

//////////////////////////////////////////////////////
// 🧠 NÓS (CAMPO)
//////////////////////////////////////////////////////

const tags = [
  "incerteza","decisão","estrutura","fluxo","caos",
  "ordem","ansiedade","clareza","ruído","silêncio",
  "memória","esquecimento","foco","dispersão","conflito",
  "integração","ruptura","estabilidade","movimento","ação"
];

const nodes = tags.map(t => ({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  vx:0,
  vy:0,
  label:t,
  r:4
}));

//////////////////////////////////////////////////////
// 🧠 GRUPOS
//////////////////////////////////////////////////////

function group(tag){

  const g = {
    caos:["caos","ruído","ruptura","conflito","ansiedade"],
    ordem:["ordem","estrutura","clareza","estabilidade"],
    fluxo:["fluxo","movimento","ação","integração"],
    introspectivo:["memória","silêncio","esquecimento"],
    cognitivo:["decisão","foco"]
  };

  for(let k in g){
    if(g[k].includes(tag)) return k;
  }

  return "neutro";
}

//////////////////////////////////////////////////////
// 🧠 CLUSTERS
//////////////////////////////////////////////////////

function detectClusters(){

  const visited = new Array(nodes.length).fill(false);
  const clusters = [];

  function dfs(i, cluster){

    visited[i]=true;
    cluster.push(nodes[i]);

    for(let j=0;j<nodes.length;j++){

      if(visited[j]) continue;

      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const d = Math.sqrt(dx*dx+dy*dy);

      if(d < 85) dfs(j, cluster);

    }

  }

  for(let i=0;i<nodes.length;i++){
    if(!visited[i]){
      const c=[];
      dfs(i,c);
      clusters.push(c);
    }
  }

  return clusters;

}

//////////////////////////////////////////////////////
// 🧠 INTERPRETAÇÃO
//////////////////////////////////////////////////////

function interpret(cluster){

  const freq = {};

  for(let n of cluster){
    const g = group(n.label);
    freq[g] = (freq[g]||0)+1;
  }

  return Object.entries(freq)
    .sort((a,b)=>b[1]-a[1])[0]?.[0] || "neutro";

}

//////////////////////////////////////////////////////
// 🧠 LINGUAGEM EMERGENTE
//////////////////////////////////////////////////////

function generateSentence(g){

  const map = {

    caos:"instabilidade estrutural persistente no campo",
    ordem:"organização progressiva e estabilização sistêmica",
    fluxo:"movimento contínuo entre estados cognitivos",
    introspectivo:"internalização dominante do processamento",
    cognitivo:"convergência de decisões e foco operacional",
    neutro:"estado híbrido sem dominância estrutural"

  };

  return map[g] || map.neutro;

}

//////////////////////////////////////////////////////
// 🧠 🔥 REALIMENTAÇÃO SEMÂNTICA (NÚCLEO DO v3)
//////////////////////////////////////////////////////

function applySemanticForce(g, cluster){

  // intensidade baseada no tamanho do cluster
  const intensity = cluster.length / 10;

  semanticMemory[g] += intensity;

  // limitar crescimento
  semanticMemory[g] = Math.min(5, semanticMemory[g]);

}

//////////////////////////////////////////////////////
// 🧠 FORÇA SEMÂNTICA GLOBAL
//////////////////////////////////////////////////////

function semanticBias(tag){

  const g = group(tag);
  return semanticMemory[g] || 0;

}

//////////////////////////////////////////////////////
// 🧠 UPDATE (FÍSICA + SEMÂNTICA FEEDBACK LOOP)
//////////////////////////////////////////////////////

function update(){

  const clusters = detectClusters();

  let newNarratives = [];

  for(let c of clusters){

    const g = interpret(c);

    applySemanticForce(g, c);

    const sentence = generateSentence(g);

    newNarratives.push(sentence);

    narratives.push(sentence);

  }

  if(narratives.length > 10){
    narratives.shift();
  }

  // HUD
  document.getElementById("clusters").innerText = clusters.length;
  document.getElementById("oracle").innerText = newNarratives.join("\n");

  // FÍSICA
  for(let i=0;i<nodes.length;i++){

    const a = nodes[i];

    let fx=0, fy=0;

    for(let j=0;j<nodes.length;j++){

      if(i===j) continue;

      const b = nodes[j];

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.sqrt(dx*dx+dy*dy)+0.1;

      let f = (group(a.label) === group(b.label)) ? 0.6 : 0.05;

      // 🔥 INFLUÊNCIA SEMÂNTICA GLOBAL (v3)
      f += semanticBias(a.label);

      fx += (dx/d)*f;
      fy += (dy/d)*f;

    }

    // ruído mínimo
    fx += (Math.random()-0.5)*0.1;
    fy += (Math.random()-0.5)*0.1;

    a.vx += fx*0.02;
    a.vy += fy*0.02;

    a.vx *= 0.9;
    a.vy *= 0.9;

    a.x += a.vx;
    a.y += a.vy;

  }

}

//////////////////////////////////////////////////////
// 🧠 DRAW
//////////////////////////////////////////////////////

function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // conexões
  for(let i=0;i<nodes.length;i++){

    for(let j=i+1;j<nodes.length;j++){

      const a=nodes[i], b=nodes[j];

      const dx=a.x-b.x;
      const dy=a.y-b.y;
      const d=Math.sqrt(dx*dx+dy*dy);

      if(d<110){

        ctx.strokeStyle=`rgba(255,179,0,${1-d/110})`;
        ctx.lineWidth=0.5;

        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();

      }

    }

  }

  // nós
  for(let n of nodes){

    ctx.fillStyle="#ffb300";

    ctx.beginPath();
    ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fill();

  }

}

//////////////////////////////////////////////////////
// 🧠 LOOP
//////////////////////////////////////////////////////

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
