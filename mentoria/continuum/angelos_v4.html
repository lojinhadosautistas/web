<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AngelOS v4 • Sistema Cognitivo Avançado</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0a0f1d;
    color:#eaeaea;
}

header{
    background:#121a2f;
    padding:16px;
    text-align:center;
    border-bottom:1px solid #1f2a44;
}

header h1{ margin:0; font-size:20px; }

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:14px;
}

.card{
    background:#121a2f;
    border:1px solid #1f2a44;
    border-radius:10px;
    padding:12px;
}

.full{ grid-column:span 2; }

input,select,textarea{
    width:100%;
    margin:6px 0;
    padding:8px;
    border-radius:8px;
    border:none;
    background:#0a0f1d;
    color:white;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#4f7cff;
    color:white;
    cursor:pointer;
}

button:hover{ background:#3b63d1; }

.entry{
    font-size:12px;
    padding:10px;
    margin-bottom:8px;
    background:#0a0f1d;
    border-radius:8px;
    border:1px solid #1f2a44;
}

.badge{
    display:inline-block;
    font-size:11px;
    padding:2px 6px;
    background:#1f2a44;
    border-radius:6px;
    margin-right:4px;
}

.alert{
    padding:8px;
    margin-bottom:6px;
    border-left:3px solid #4f7cff;
    background:#0d1426;
    border-radius:8px;
    font-size:12px;
}
</style>
</head>

<body>

<header>
<h1>🧠 AngelOS v4</h1>
<small>IA Analítica • Correlação • Evolução Cognitiva</small>
</header>

<div class="grid">

<!-- CHECK-IN -->
<div class="card">
<h3>📅 Check-in Diário</h3>

<label>Linguagem</label>
<select id="linguagem">
<option>baixo</option><option>medio</option><option>alto</option>
</select>

<label>Cognição</label>
<select id="cognicao">
<option>baixo</option><option>medio</option><option>alto</option>
</select>

<label>Regulação</label>
<select id="regulacao">
<option>instavel</option><option>media</option><option>estavel</option>
</select>

<label>Crises</label>
<input id="crises" type="number" value="0"/>

<label>Sono (qualidade)</label>
<select id="sono">
<option>ruim</option><option>medio</option><option>bom</option>
</select>

<label>Rotina</label>
<select id="rotina">
<option>instavel</option><option>media</option><option>organizada</option>
</select>

<label>Observações</label>
<textarea id="obs"></textarea>

<button onclick="save()">Salvar Registro</button>
</div>

<!-- INSIGHTS -->
<div class="card">
<h3>🧠 IA Analítica (Hipóteses)</h3>
<div id="insights"></div>
</div>

<!-- GRÁFICO -->
<div class="card full">
<h3>📊 Evolução Multivariável</h3>
<canvas id="chart"></canvas>
</div>

<!-- CORRELAÇÃO -->
<div class="card full">
<h3>🔗 Correlações Detectadas</h3>
<div id="corr"></div>
</div>

<!-- TIMELINE -->
<div class="card full">
<h3>🧭 Linha do Tempo</h3>
<div id="timeline"></div>
</div>

</div>

<script>

const KEY="angelos_v4";

function load(){
return JSON.parse(localStorage.getItem(KEY)||"[]");
}

function store(d){
localStorage.setItem(KEY,JSON.stringify(d));
}

function map(v){
return {
baixo:1,medio:2,alto:3,
ruim:1,medio:2,bom:3,
instavel:1,media:2,estavel:3,
organizada:3
}[v]||0;
}

function save(){
let d=load();

d.push({
date:new Date().toISOString().split("T")[0],
linguagem:linguagem.value,
cognicao:cognicao.value,
regulacao:regulacao.value,
crises:+crises.value,
sono:sono.value,
rotina:rotina.value,
obs:obs.value
});

store(d);
obs.value="";
render();
}

function render(){
let d=load();

renderChart(d);
renderTimeline(d);
renderInsights(d);
renderCorrelation(d);
}

let chart;

function renderChart(d){

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:d.map(x=>x.date),
datasets:[
{
label:"Linguagem",
data:d.map(x=>map(x.linguagem)),
borderColor:"#4f7cff"
},
{
label:"Cognição",
data:d.map(x=>map(x.cognicao)),
borderColor:"#ffb84f"
},
{
label:"Regulação",
data:d.map(x=>map(x.regulacao)),
borderColor:"#4fff9f"
},
{
label:"Crises",
data:d.map(x=>x.crises),
borderColor:"#ff4f4f"
}
]
},
options:{
scales:{y:{min:0,max:3}}
}
});
}

function renderTimeline(d){

document.getElementById("timeline").innerHTML=
[...d].reverse().map(x=>`
<div class="entry">
<b>${x.date}</b><br>
<span class="badge">L:${x.linguagem}</span>
<span class="badge">C:${x.cognicao}</span>
<span class="badge">R:${x.regulacao}</span>
<span class="badge">Sono:${x.sono}</span>
<span class="badge">Rot:${x.rotina}</span>
<span class="badge">Cr:${x.crises}</span>
<br>${x.obs||""}
</div>
`).join("");
}

function avg(arr, key){
return arr.reduce((a,b)=>a+map(b[key]),0)/arr.length||0;
}

function corr(x,y,data){

let n=data.length;
let sx=0,sy=0,sxy=0,sx2=0,sy2=0;

for(let i=0;i<n;i++){
let a=map(data[i][x]);
let b=map(data[i][y]);
sx+=a; sy+=b; sxy+=a*b; sx2+=a*a; sy2+=b*b;
}

return ((n*sxy - sx*sy) /
Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy))).toFixed(2);
}

function renderCorrelation(d){

if(d.length<5){
document.getElementById("corr").innerHTML="Dados insuficientes.";
return;
}

let pairs=[
["sono","crises"],
["rotina","regulacao"],
["regulacao","linguagem"]
];

document.getElementById("corr").innerHTML=
pairs.map(p=>{
let c=corr(p[0],p[1],d);
return `<div class="alert">Correlação ${p[0]} × ${p[1]}: ${c}</div>`;
}).join("");
}

function renderInsights(d){

let last=d.slice(-7);

if(last.length===0){
document.getElementById("insights").innerHTML="Sem dados.";
return;
}

let out=[];

let crises=last.reduce((a,b)=>a+b.crises,0);

if(crises>=3)
out.push("⚠️ Crises elevadas nos últimos dias.");

if(avg(last,"sono")<2)
out.push("😴 Sono abaixo do ideal correlacionado a instabilidade.");

if(avg(last,"rotina")<2)
out.push("📉 Rotina instável pode estar influenciando regulação.");

if(avg(last,"linguagem")>2.2)
out.push("📈 Linguagem em tendência positiva.");

if(out.length===0)
out=["🧠 Nenhuma anomalia detectada no período recente."];

document.getElementById("insights").innerHTML=
out.map(x=>`<div class="alert">${x}</div>`).join("");
}

render();

</script>

</body>
</html>
