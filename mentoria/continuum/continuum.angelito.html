<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Angelo Radar • Memória Longitudinal</title>

<style>
    body{
        font-family: Arial, sans-serif;
        margin:0;
        background:#0f1220;
        color:#eaeaea;
    }

    header{
        padding:20px;
        background:#1b1f36;
        text-align:center;
    }

    h1{ margin:0; font-size:20px; }
    small{ opacity:.7; }

    .container{
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap:16px;
        padding:16px;
    }

    .card{
        background:#1b1f36;
        padding:16px;
        border-radius:10px;
    }

    label{
        font-size:12px;
        opacity:.8;
        display:block;
        margin-top:8px;
    }

    select, textarea, input{
        width:100%;
        padding:8px;
        margin-top:4px;
        border-radius:6px;
        border:none;
        background:#0f1220;
        color:white;
    }

    button{
        margin-top:10px;
        padding:10px;
        width:100%;
        border:none;
        border-radius:8px;
        background:#4c7dff;
        color:white;
        cursor:pointer;
    }

    button:hover{
        background:#3a66d6;
    }

    .entry{
        background:#0f1220;
        padding:10px;
        border-radius:8px;
        margin-bottom:8px;
        font-size:12px;
    }

    .tag{
        display:inline-block;
        padding:2px 6px;
        border-radius:6px;
        background:#2a2f4a;
        margin-right:5px;
        font-size:11px;
    }

    .full{
        grid-column: span 2;
    }

    .week{
        font-size:12px;
        opacity:.8;
    }
</style>
</head>

<body>

<header>
    <h1>🧭 Angelo Radar • Memória Longitudinal</h1>
    <small>Check-ins diários + evolução semanal + histórico contínuo</small>
</header>

<div class="container">

    <!-- CHECK-IN -->
    <div class="card">
        <h3>📅 Check-in Diário</h3>

        <label>Linguagem</label>
        <select id="linguagem">
            <option>baixo</option><option>medio</option><option>alto</option>
        </select>

        <label>Cognição</label>
        <select id="cognicao">
            <option>baixo</option><option>medio</option><option>alto</option>
        </select>

        <label>Brincadeira</label>
        <select id="brincadeira">
            <option>baixo</option><option>medio</option><option>alto</option>
        </select>

        <label>Atenção compartilhada</label>
        <select id="atencao">
            <option>baixo</option><option>medio</option><option>alto</option>
        </select>

        <label>Regulação (humor)</label>
        <select id="humor">
            <option>calmo</option><option>instavel</option><option>irritado</option>
        </select>

        <label>Crises hoje</label>
        <input type="number" id="crises" value="0"/>

        <label>Bem-estar geral</label>
        <select id="bemestar">
            <option>ruim</option><option>ok</option><option>bom</option>
        </select>

        <label>Observações</label>
        <textarea id="obs"></textarea>

        <button onclick="salvar()">Salvar Check-in</button>
    </div>

    <!-- RESUMO SEMANAL -->
    <div class="card">
        <h3>📊 Resumo Semanal</h3>
        <div id="weekly"></div>
    </div>

    <!-- HISTÓRICO -->
    <div class="card full">
        <h3>🧠 Histórico Longitudinal</h3>
        <div id="history"></div>
    </div>

</div>

<script>
const KEY = "angelo_radar_v1";

function getData(){
    return JSON.parse(localStorage.getItem(KEY) || "[]");
}

function saveData(data){
    localStorage.setItem(KEY, JSON.stringify(data));
}

function salvar(){
    const entry = {
        date: new Date().toISOString().split("T")[0],
        linguagem: document.getElementById("linguagem").value,
        cognicao: document.getElementById("cognicao").value,
        brincadeira: document.getElementById("brincadeira").value,
        atencao: document.getElementById("atencao").value,
        humor: document.getElementById("humor").value,
        crises: parseInt(document.getElementById("crises").value || 0),
        bemestar: document.getElementById("bemestar").value,
        obs: document.getElementById("obs").value
    };

    const data = getData();
    data.push(entry);
    saveData(data);

    alert("Check-in salvo!");
    render();
}

function render(){

    const data = getData().reverse();

    // HISTÓRICO
    const history = document.getElementById("history");
    history.innerHTML = "";

    data.forEach(d=>{
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
            <strong>${d.date}</strong><br>
            <span class="tag">L:${d.linguagem}</span>
            <span class="tag">C:${d.cognicao}</span>
            <span class="tag">B:${d.brincadeira}</span>
            <span class="tag">A:${d.atencao}</span>
            <span class="tag">H:${d.humor}</span>
            <span class="tag">Crises:${d.crises}</span>
            <span class="tag">${d.bemestar}</span>
            <br><small>${d.obs || ""}</small>
        `;
        history.appendChild(div);
    });

    // SEMANA (últimos 7 registros)
    const weekly = document.getElementById("weekly");
    const last7 = data.slice(0,7);

    if(last7.length === 0){
        weekly.innerHTML = "Sem dados ainda.";
        return;
    }

    const avg = (arr, key, map) => {
        let sum = 0;
        arr.forEach(a=> sum += map[a[key]] || 0);
        return (sum / arr.length).toFixed(1);
    };

    const mapLevel = {baixo:1, medio:2, alto:3, ruim:1, ok:2, bom:3, calmo:3, instavel:2, irritado:1};

    weekly.innerHTML = `
        <div class="week">Últimos 7 registros</div><br>
        Linguagem média: ${avg(last7,"linguagem",mapLevel)}<br>
        Cognição média: ${avg(last7,"cognicao",mapLevel)}<br>
        Brincadeira média: ${avg(last7,"brincadeira",mapLevel)}<br>
        Atenção média: ${avg(last7,"atencao",mapLevel)}<br>
        Humor médio: ${avg(last7,"humor",mapLevel)}<br>
        Crises totais: ${last7.reduce((a,b)=>a+b.crises,0)}
    `;
}

render();
</script>

</body>
</html>
